    <script>
      // Apply saved theme and festival variables before initial paint
      try {
        var t = localStorage.getItem('utsav_theme');
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
        }
        var fest = localStorage.getItem('utsav_festival_theme') || 'diwali';
        var festPrimary = {
          diwali: '#7928CA',
          navratri: '#D91B5C',
          wedding: '#800020',
          holi: '#E11D48',
          eid: '#065F46',
          newyear: '#1E293B'
        }[fest] || '#7928CA';
        document.documentElement.style.setProperty('--fest-primary', festPrimary);
      } catch (e) {}
    </script>
